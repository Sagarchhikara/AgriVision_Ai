seed: 42

dataset:
  root: datasets/
  num_workers: 4
  pin_memory: true
  use_weighted_sampler: true

training:
  batch_size: 32
  epochs: 20
  learning_rate: 0.0003
  image_size: 224
  stage1_epochs: 5
  stage2_epochs: 15
  stage1_lr: 0.0003
  stage2_lr: 0.00003

model:
  name: efficientnet_b0
  pretrained: true

output:
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs

llm:
  enabled: true
  provider: fake            # fake | gemini | openai
  # Verified working and fast (~2.5s per report). gemini-3.8-flash is stronger but
  # was returning 503 "high demand" on the free tier; switch when capacity allows.
  model: gemini-3.5-flash-lite
  timeout_seconds: 30
  max_output_tokens: 1200
  temperature: 0.3
  # Below this top-1 confidence, reports are generated in non-definitive mode.
  # The classifier scores ~96% on lab photos but ~22% on real field photos, so a
  # confident-sounding report on a low-confidence prediction is harmful advice.
  confidence_threshold: 0.60
  default_language: en
  # API keys are NEVER read from this file. Set GEMINI_API_KEY / OPENAI_API_KEY
  # (or AGRIVISION_LLM_API_KEY) in the environment instead.
  cache:
    enabled: true
    ttl_seconds: 86400
    max_entries: 512
    confidence_bucket_size: 10

backend:
  checkpoint_path: outputs/checkpoints/best.pt
  top_k: 3
  confidence_threshold: 0.0
  host: 0.0.0.0
  port: 8000
  log_level: INFO
  log_file: outputs/logs/backend.log
  # Browser origins allowed to call the API. Override per deployment with
  # AGRIVISION_CORS_ORIGINS='["https://your-frontend.example"]'. Avoid "*".
  cors_origins:
    - "http://localhost:3000"
  max_upload_bytes: 10485760   # 10 MB
  feedback_dir: outputs/feedback
  device: auto
