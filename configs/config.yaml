seed: 42

dataset:
  root: datasets/
  num_workers: 4
  pin_memory: true
  use_weighted_sampler: true

training:
  batch_size: 32
  epochs: 20
  learning_rate: 0.0003
  image_size: 224
  stage1_epochs: 5
  stage2_epochs: 15
  stage1_lr: 0.0003
  stage2_lr: 0.00003

model:
  name: efficientnet_b0
  pretrained: true

output:
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs

backend:
  checkpoint_path: outputs/checkpoints/best.pt
  top_k: 3
  confidence_threshold: 0.0
  host: 0.0.0.0
  port: 8000
  log_level: INFO
  log_file: outputs/logs/backend.log
  cors_origins:
    - "*"
  device: auto
